name: Daily AI Marketing Brief

on:
  schedule:
    # 7:00 AM ET = 11:00 UTC (EST) or 11:00 UTC (EDT adjusted below)
    # Running at 11:00 UTC covers 7 AM EDT / 6 AM EST — close enough
    - cron: '0 11 * * *'
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate morning brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: python generate_brief.py

      - name: Commit and push updated page
        run: |
          git config user.name "AI Marketing Brief Bot"
          git config user.email "bot@aimarketingbrief.com"
          git add index.html
          git diff --staged --quiet || git commit -m "📰 Daily brief - $(date +'%Y-%m-%d')"
          git push
