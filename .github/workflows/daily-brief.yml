name: Daily AI Marketing Brief

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r brief/requirements.txt

      - name: Generate morning brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd brief
          python generate_brief.py

      - name: Commit and push updated page
        run: |
          git config user.name "AI Marketing Brief Bot"
          git config user.email "bot@aimarketingbrief.com"
          git add brief/index.html
          git diff --staged --quiet || git commit -m "📰 Daily brief - $(date +'%Y-%m-%d')"
          git push
